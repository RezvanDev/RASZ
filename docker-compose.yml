version: "3.8"

services:
  finance-bot:
    build: .
    container_name: personal_finance_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent volume for SQLite database
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

